<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SnoezMind</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="auth-section" class="container" style="max-width: 440px; margin-top: 32px;">
    <div class="card">
      <h1>SnoezMind</h1>
      <p class="subtitle">Acesse ou crie sua conta para continuar</p>
      <div id="auth-alert" class="alert"></div>

      <form id="login-form">
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-pass" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-gold">Entrar</button>
        <div class="links-row">
          <button type="button" class="link-btn" onclick="switchTab('register')">Criar conta</button>
          <button type="button" class="link-btn" onclick="switchTab('recover')">Recuperar senha</button>
        </div>
      </form>

      <form id="register-form" class="hidden">
        <div class="field">
          <label>Nome completo</label>
          <input type="text" id="reg-nome" required placeholder="Seu nome">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>
        <div class="field">
          <label>WhatsApp</label>
          <input type="tel" id="reg-whatsapp" required inputmode="tel" placeholder="(61) 99999-9999">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="reg-pass" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn btn-gold">Cadastrar</button>
        <div class="links-row">
          <button type="button" class="link-btn" onclick="switchTab('login')">Voltar ao login</button>
        </div>
      </form>

      <form id="recover-form" class="hidden">
        <div class="field">
          <label>E-mail cadastrado</label>
          <input type="email" id="rec-email" required placeholder="seu@email.com">
        </div>
        <button type="submit" class="btn btn-gold">Enviar link de recuperação</button>
        <div class="links-row">
          <button type="button" class="link-btn" onclick="switchTab('login')">Voltar ao login</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <header class="topbar">
      <span class="brand">SnoezMind</span>
      <button class="btn btn-outline btn-sm" onclick="logoutUser()">Sair</button>
    </header>
    <main class="container">
      <div class="card">
        <h2>Área do Usuário</h2>
        <p class="subtitle">Conectado como: <strong id="user-email"></strong></p>
        <div id="app-workspace">
          <!-- As funções específicas do aplicativo entram aqui -->
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
